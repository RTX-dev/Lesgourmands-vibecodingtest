<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Gourmand — Destiny 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Écran de chargement -->
    <div id="loading" class="loading">
        <div class="loading-inner">
            <h1 class="loading-title">Les <span class="accent">Gourmand</span></h1>
            <p class="loading-sub">Destiny 2 · Carte céleste du clan</p>
            <div class="loading-bar"><div class="loading-fill" id="loadFill"></div></div>
            <p class="loading-status" id="loadStatus">Connexion au Voyageur...</p>
        </div>
    </div>

    <!-- Carte céleste plein écran -->
    <main id="app" class="app hidden" aria-hidden="true">
        <div class="map-frame" id="mapFrame">
            <img src="image.jpg" alt="Carte céleste" id="mapImg">
            <div class="map-overlay"></div>

            <!-- Marqueurs de planètes (générés par script.js) -->
            <div id="markers" class="markers"></div>

            <!-- Réticule (image reticle.png fournie par le clan) -->
            <div class="reticle" id="reticle" aria-hidden="true">
                <img src="reticle.png" alt="" class="ret-img" draggable="false">
            </div>

            <!-- Panneau d'info (contenu mis à jour selon la planète survolée) -->
            <aside class="planet-panel" id="panel" aria-hidden="true">
                <div class="panel-header">
                    <div class="emblem" id="panelEmblem"></div>
                    <div>
                        <h2 id="panelName">—</h2>
                        <span class="tag" id="panelCat">—</span>
                    </div>
                </div>
                <p class="panel-desc" id="panelDesc">—</p>
                <ul class="panel-stats" id="panelStats"></ul>
            </aside>
        </div>

        <!-- Panneau latéral : complément d'info au clic sur une planète -->
        <aside class="side-panel" id="sidePanel" aria-hidden="true">
            <button class="side-close" id="sideClose" aria-label="Fermer le panneau"></button>
            <div class="panel-header">
                <div class="emblem" id="sideEmblem"></div>
                <div>
                    <h2 id="sideName">—</h2>
                    <span class="tag" id="sideCat">—</span>
                </div>
            </div>
            <p class="side-lore" id="sideLore">—</p>
            <h3 class="side-subtitle">En détail</h3>
            <ul class="side-details" id="sideDetails"></ul>
            <p class="side-hint">Clique ailleurs sur la carte pour fermer</p>
        </aside>
    </main>

    <!-- Étiquette HUD façon Bungie -->
    <div class="hud-label">
        <span class="hud-diamond"></span>
        <span>Les Gourmand · Carte céleste</span>
    </div>

    <!-- Affichage coordonnées en mode calibrage (?debug) -->
    <div id="debugInfo" class="debug-info hidden"></div>

    <script src="script.js"></script>
</body>
</html>
